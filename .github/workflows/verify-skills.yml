name: Verify Agent Skills

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run structural and blinding verification
        run: python3 scripts/verify_repo.py
      - name: Smoke test A/B harness
        run: python3 scripts/ab_harness.py self-test
      - name: Smoke test skill scaffolder
        run: python3 scripts/new_skill.py ci-smoke --mode user --goal "Smoke check" --dry-run
      - name: Smoke test skill installer
        run: python3 scripts/install_skills.py self-test
      - name: Smoke test external skill manager
        run: python3 scripts/external_skills.py self-test
